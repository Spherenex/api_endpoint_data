<!DOCTYPE html>
<html>
<head>

<title>Spherenex Audio Dashboard</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
    font-family: Arial, Helvetica, sans-serif;
    background:#f4f6f8;
    color:#1f2937;
    margin:0;
    padding:32px 20px;
}


.container{
    max-width:900px;
    margin:auto;
}


.box{
    background:white;
    padding:24px;
    border:1px solid #e5e7eb;
    border-radius:10px;
    margin-bottom:18px;
    box-shadow:0 2px 8px rgba(15,23,42,.06);
}


h1{
    margin:0 0 24px;
    font-size:26px;
    color:#111827;
}

h2{
    margin:0 0 18px;
    font-size:20px;
    color:#111827;
}

h3{
    margin:0 0 12px;
    font-size:16px;
}

#loginBox{
    max-width:420px;
    margin:80px auto 0;
}

#loginBox h1{
    text-align:center;
}


input{
    width:100%;
    box-sizing:border-box;
    padding:11px 12px;
    margin:0 0 14px;
    border-radius:6px;
    border:1px solid #d1d5db;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.12);
}


button{
    background:#2563eb;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:6px;
    cursor:pointer;
    font-size:14px;
    font-weight:600;
}


button:hover{

background:#1d4ed8;

}


.audio-card{
    background:#f9fafb;
    padding:16px;
    border:1px solid #e5e7eb;
    border-radius:8px;
    margin:12px 0;
}


audio{

width:100%;

}


.status{
    font-size:16px;
    line-height:1.7;
}


#error{
    color:#dc2626;
    font-size:14px;
    margin-bottom:0;
}

.dashboard-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.dashboard-header h1{
    margin:0;
}

@media (max-width:600px){
    body{padding:16px 12px;}
    .box{padding:18px;}
    #loginBox{margin-top:40px;}
    .dashboard-header{align-items:flex-start;}
}


</style>


</head>



<body>


<div class="container">


<div class="box" id="loginBox">


<h1>
🎙 Spherenex Login
</h1>


<input id="email"
placeholder="Email">


<br>


<input id="password"
type="password"
placeholder="Password">


<br><br>


<button onclick="login()">
Login
</button>


<p id="error"></p>


</div>






<div id="dashboard" style="display:none">


<div class="box dashboard-header">


<h1>
🎙 Audio Recorder Dashboard
</h1>


<button onclick="logout()">
Logout
</button>


</div>





<div class="box">


<h2>
Device Status
</h2>


<div id="status"
class="status">

Loading...

</div>


</div>







<div class="box">


<h2>
Audio Logs
</h2>


<div id="audioList">

Loading files...

</div>


</div>



</div>


</div>







<!-- Firebase SDK -->


<script src=
"https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js">
</script>


<script src=
"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js">
</script>


<script src=
"https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js">
</script>


<script src=
"https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js">
</script>





<script>


/***************
 FIREBASE CONFIG
****************/


const firebaseConfig = {


apiKey:"AIzaSyAr4IYnykpwovqOJWzfBd7abVdAma_Ig3Q",

authDomain:"diet-planner-3bdf3.firebaseapp.com",

databaseURL:"https://diet-planner-3bdf3-default-rtdb.firebaseio.com",

projectId:"diet-planner-3bdf3",

storageBucket:"diet-planner-3bdf3.firebasestorage.app",

messagingSenderId:"927878354911",

appId:"1:927878354911:web:2e616b171a267b9910566a",

measurementId:"G-MSYWCM58MT"


};





firebase.initializeApp(firebaseConfig);



const auth=firebase.auth();

const storage=firebase.storage();

const database=firebase.database();






/******************
 LOGIN
*******************/


function login(){


let email=
document.getElementById("email").value;


let password=
document.getElementById("password").value;




auth.signInWithEmailAndPassword(
email,
password
)

.then(()=>{


document.getElementById("loginBox")
.style.display="none";


document.getElementById("dashboard")
.style.display="block";


loadAudio();


loadStatus();


})


.catch(err=>{


document.getElementById("error")
.innerHTML=err.message;


});


}







/******************
 LOGOUT
*******************/


function logout(){

auth.signOut();

location.reload();

}








/******************
 LOAD AUDIO FILES
*******************/


function loadAudio(){


let folder=
storage.ref("Audio_Log");



folder.listAll()

.then(result=>{


let output="";



result.items.forEach(file=>{


file.getDownloadURL()

.then(url=>{


output += `


<div class="audio-card">


<h3>
${file.name}
</h3>


<audio controls>

<source src="${url}" type="audio/ogg">

</audio>


<br><br>


<a href="${url}" download>

<button>
Download

</button>

</a>


</div>


`;



document.getElementById("audioList")
.innerHTML=output;



});


});



})

.catch(err=>{


document.getElementById("audioList")
.innerHTML=err.message;


});


}








/******************
 DEVICE STATUS
*******************/


function loadStatus(){



database.ref("Device_Status")

.on("value",snapshot=>{


let data=snapshot.val();



if(data){


document.getElementById("status")
.innerHTML=


`

🟢 Device :
${data.Device || "Online"}

<br>


🔋 Battery :
${data.Battery || "--"}


<br>


📡 WiFi :
${data.WiFi || "--"}


<br>


⏱ Last Update :
${data.Last_Update || "--"}


`;



}

else{


document.getElementById("status")
.innerHTML=
"No Data";


}



});


}





</script>


</body>
</html>
